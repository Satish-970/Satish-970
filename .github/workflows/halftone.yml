name: Generate dotted avatar
on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"
  push:
    paths: ["scripts/halftone.py"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pillow
      - run: python scripts/halftone.py ${{ github.repository_owner }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git rm -f --ignore-unmatch assets/avatar-dark.svg assets/avatar-light.svg
          git add assets/*.svg
          git diff --staged --quiet || git commit -m "chore: refresh dotted hero"
          git push
